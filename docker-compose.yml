services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo_list}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_list}
      POSTGRES_DB: ${POSTGRES_DB:-todo_list}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_list} -d ${POSTGRES_DB:-todo_list}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo_list}:${POSTGRES_PASSWORD:-todo_list}@db:5432/${POSTGRES_DB:-todo_list}
    volumes:
      - ./apps/backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
